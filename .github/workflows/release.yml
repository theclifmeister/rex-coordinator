name: release

# Tags and releases v<version> when a new plugin.json version reaches main.
# The version is bumped on a release/vX.Y.Z branch (tools/bump-version.sh) and
# reaches main by pull request; nothing is committed here.
on:
  push:
    branches: [main]
    paths: ['.claude-plugin/plugin.json']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag + GitHub Release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not on main; not releasing"; exit 1; }
          v=$(jq -r .version .claude-plugin/plugin.json)
          tag="v$v"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already released"; exit 0
          fi
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          # Every merge since the previous tag, newest first: the release PR's merge
          # and the task merges inside it (--first-parent would hide those behind
          # the PR merge's second parent). No merges: the plain commits instead.
          range=${prev:+"$prev"..}HEAD
          notes=$(git log --merges --format='- %s (%h)' "$range" | grep -v '^- Release v' || true)
          [ -n "$notes" ] || notes=$(git log --no-merges --format='- %s (%h)' "$range" | grep -v '^- Release v' || true)
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "rex-coordinator $tag" --notes "${notes:-No changes listed.}"
